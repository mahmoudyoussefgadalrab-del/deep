
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Different Frames</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px;
  background: #080e1c;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.frame {
  width: 100%;
  border: 2px solid #263b5d;
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
}

.frame iframe {
  display: block;
  width: 100%;
  height: 300px;
  border: 0;
}

/* Different frame sizes */
.frame1 iframe { height: 320px; }
.frame2 iframe { height: 280px; }
.frame3 iframe { height: 350px; }
.frame4 iframe { height: 300px; }
.frame5 iframe { height: 330px; }
.frame6 iframe { height: 270px; }
.frame7 iframe { height: 360px; }

@media (max-width: 650px) {
  .container {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="frame frame1">
    <iframe src="https://lltrco.com/?r=mahmoudyoussef20"></iframe>
  </div>

  <div class="frame frame2">
    <iframe src="https://lltrco.com/?r=mahmoudyoussef2024"></iframe>
  </div>

  <div class="frame frame3">
    <iframe src="https://lltrco.com/?r=mmyy1"></iframe>
  </div>

  <div class="frame frame4">
    <iframe src="https://lltrco.com/?r=mmyy11"></iframe>
  </div>

  <!-- Last 3 frames: delayed by 5 seconds -->

  <div class="frame frame5">
    <iframe data-src="https://lltrco.com/?r=mmyy2"></iframe>
  </div>

  <div class="frame frame6">
    <iframe data-src="https://lltrco.com/?r=mmyy4"></iframe>
  </div>

  <div class="frame frame7">
    <iframe data-src="https://lltrco.com/?r=mmyy5"></iframe>
  </div>

</div>

<script>
setTimeout(function() {
  document.querySelectorAll("iframe[data-src]")
    .forEach(function(frame) {
      frame.src = frame.dataset.src;
    });
}, 5000);
</script>

</body>
</html>
