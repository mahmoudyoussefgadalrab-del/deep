
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7 Different Frames</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 8px;
  background: #111;
}

.frame {
  width: 100%;
  margin-bottom: 8px;
  overflow: hidden;
  border: 1px solid #444;
  border-radius: 5px;
}

.frame iframe {
  width: 100%;
  display: block;
  border: 0;
}

.f1 iframe { height: 140px; }
.f2 iframe { height: 210px; }
.f3 iframe { height: 170px; }
.f4 iframe { height: 260px; }
.f5 iframe { height: 190px; }
.f6 iframe { height: 230px; }
.f7 iframe { height: 155px; }
</style>
</head>

<body>

<div class="frame f1">
  <iframe src="LINK-1" loading="eager"></iframe>
</div>

<div class="frame f2">
  <iframe src="LINK-2" loading="eager"></iframe>
</div>

<div class="frame f3">
  <iframe src="LINK-3" loading="eager"></iframe>
</div>

<div class="frame f4">
  <iframe src="LINK-4" loading="eager"></iframe>
</div>

<div class="frame f5">
  <iframe src="LINK-5" loading="eager"></iframe>
</div>

<div class="frame f6">
  <iframe src="LINK-6" loading="eager"></iframe>
</div>

<div class="frame f7">
  <iframe src="LINK-7" loading="eager"></iframe>
</div>

</body>
</html>
