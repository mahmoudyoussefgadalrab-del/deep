
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Traffic Hub</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080e1c;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    margin: 0;
    padding: 0;
}

.header {
    background: linear-gradient(120deg, #101d35, #142c4d);
    padding: 14px 12px;
    text-align: center;
    border-bottom: 2px solid #2676c9;
}

.header h1 {
    color: #ffffff;
    font-size: 22px;
    margin: 0;
    letter-spacing: 1px;
}

.header p {
    color: #a9c5e5;
    font-size: 12px;
    margin: 6px 0 0;
}

.content {
    width: 100%;
    margin: 0;
    padding: 0;
}

.frame {
    width: 100%;
    height: 100vh;
    min-height: 600px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #ffffff;
}

.frame iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
    margin: 0;
    padding: 0;
}

.footer {
    padding: 15px;
    text-align: center;
    color: #8298b5;
    font-size: 11px;
    background: #080e1c;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>DIGITAL TRAFFIC HUB</h1>
        <p>Your Online Traffic Experience</p>
    </div>

    <div class="content">
        <div class="frame">
            <iframe
                src="https://lltrco.com/?r=mahmoudyoussef20"
                loading="eager"
                title="Traffic Website">
            </iframe>
        </div>
    </div>

    <div class="footer">
        Digital Traffic Hub
    </div>

</div>

</body>
</html>
