
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY THREE PAGES</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080e1c;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:12px;
 text-align:center;
 background:#111c30;
 font-weight:bold;
}
.container{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:5px;
 padding:5px;
}
.screen{
 min-width:0;
 background:white;
 border:2px solid #263750;
 border-radius:5px;
 overflow:hidden;
}
.screen h3{
 margin:0;
 padding:10px 3px;
 text-align:center;
 background:#17263d;
 color:white;
 font-size:13px;
}
iframe{
 width:100%;
 height:85vh;
 border:0;
 display:block;
 background:white;
}
@media(max-width:700px){
 .container{grid-template-columns:1fr}
 iframe{height:70vh}
}
</style>
</head>
<body>

<header>MY THREE PAGES</header>

<div class="container">

<div class="screen">
<h3>PAGE 1</h3>
<iframe src="https://ggfdfgfr7-hue.github.io/mmyygg/"></iframe>
</div>

<div class="screen">
<h3>PAGE 2</h3>
<iframe src="https://ggfdfgfr7-hue.github.io/Mmyy1/"></iframe>
</div>

<div class="screen">
<h3>PAGE 3</h3>
<iframe src="https://ggfdfgfr7-hue.github.io/Mmyy/"></iframe>
</div>

</div>
</body>
</html>
