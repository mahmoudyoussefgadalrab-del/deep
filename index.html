
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Different Frames</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:5px;background:#080e1c}
.container{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
 align-items:start;
}
.frame{width:100%;overflow:hidden;background:white}
.frame iframe{width:100%;display:block;border:0}
.frame1{height:250px}
.frame1 iframe{height:250px}
.frame2{height:350px}
.frame2 iframe{height:350px}
.frame3{grid-column:1/3;height:220px}
.frame3 iframe{height:220px}
@media(max-width:500px){
 .frame1{height:250px}
 .frame2{height:350px}
 .frame3{height:220px}
}
</style>
</head>
<body>
<div class="container">

<div class="frame frame1">
<iframe loading="eager"
src="https://ggfdfgfr7-hue.github.io/mmyygg/"></iframe>
</div>

<div class="frame frame2">
<iframe loading="eager"
src="https://ggfdfgfr7-hue.github.io/Mmyy1/"></iframe>
</div>

<div class="frame frame3">
<iframe loading="eager"
src="https://ggfdfgfr7-hue.github.io/Mmyy/"></iframe>
</div>

</div>
</body>
</html>
