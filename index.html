
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Five Frame Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #080e1c;
    font-family: Arial, sans-serif;
}

.header {
    text-align: center;
    color: #ffffff;
    padding: 15px;
    margin-bottom: 15px;
}

.header h2 {
    margin: 0;
    font-size: 24px;
}

.frames {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
    max-width: 1400px;
    margin: auto;
}

.frame {
    grid-column: span 2;
    height: 420px;
    overflow: hidden;
    border: 2px solid #263b5d;
    border-radius: 12px;
    background: #ffffff;
}

.frame:nth-child(4) {
    grid-column: 2 / span 2;
}

.frame:nth-child(5) {
    grid-column: 4 / span 2;
}

.frame iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

@media(max-width: 700px) {
    .frames {
        grid-template-columns: repeat(2, 1fr);
    }

    .frame,
    .frame:nth-child(4),
    .frame:nth-child(5) {
        grid-column: span 1;
        height: 350px;
    }

    .frame:last-child {
        grid-column: 1 / -1;
    }
}

@media(max-width: 420px) {
    .frames {
        grid-template-columns: 1fr;
    }

    .frame,
    .frame:nth-child(4),
    .frame:nth-child(5),
    .frame:last-child {
        grid-column: span 1;
        height: 400px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h2>Five Independent Frames</h2>
</div>

<div class="frames">

    <div class="frame">
        <iframe src="https://ggfdfgfr7-hue.github.io/Mmyy/"></iframe>
    </div>

    <div class="frame">
        <iframe src="https://lltrco.com/?r=mmyy11"></iframe>
    </div>

    <div class="frame">
        <iframe src="https://lltrco.com/?r=mmyy2"></iframe>
    </div>

    <div class="frame">
        <iframe src="https://lltrco.com/?r=mmyy4"></iframe>
    </div>

    <div class="frame">
        <iframe src="https://lltrco.com/?r=mmyy5"></iframe>
    </div>

</div>

</body>
</html>
